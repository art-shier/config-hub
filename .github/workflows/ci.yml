name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser and lint dependencies
        run: |
          npm ci --include=dev --prefix web
          cd web
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint shell and workflows
        run: |
          shellcheck scripts/*.sh scripts/tests/*.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          bash scripts/tests/package_release_test.sh

      - name: Run complete quality gate
        run: ./scripts/check.sh
