name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Install browser and lint dependencies
        run: |
          npm ci --include=dev --prefix web
          cd web
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint shell and workflows
        run: |
          shellcheck scripts/*.sh scripts/tests/*.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          bash scripts/tests/package_release_test.sh

      - name: Run complete quality gate
        run: ./scripts/check.sh

      - name: Build Server and CLI release assets
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh "$GITHUB_REF_NAME" dist/release
